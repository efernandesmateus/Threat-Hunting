title: TH-STL-001 - Regsvr32 carregando scriptlet remoto ou componente de script
id: 2f52ff02-fe20-451e-bfd9-ceb2ed7d6ebf
status: experimental
description: >-
    Regsvr32 usado para carregar scriptlet a partir de URL ou o componente de
    execução de scriptlets.
references:
    - https://attack.mitre.org/techniques/T1218/010/
author: Eduardo Fernandes Mateus
date: 2026-11-03
tags:
    - attack.stealth
    - attack.t1218.010
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\regsvr32.exe'
        - OriginalFileName: 'REGSVR32.EXE'
    selection_args:
        - CommandLine|contains|all:
            - '/i:'
            - 'http'
        - CommandLine|contains: 'scrobj.dll'
    condition: all of selection_*
falsepositives:
    - Raros em ambientes corporativos; validar com o baseline
level: high
