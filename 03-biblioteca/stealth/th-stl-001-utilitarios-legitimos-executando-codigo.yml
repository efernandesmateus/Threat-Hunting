# TH-STL-001 — Utilitários legítimos do sistema usados para executar código
# Regras Sigma de apoio ao hunt. Ver th-stl-001-utilitarios-legitimos-executando-codigo.md.
# Status: sintaxe verificada; não validada em plataforma real (ver ADR 0006).
# Os nomes de campos seguem a taxonomia genérica do Sigma e devem ser mapeados na conversão.
# Licença: MIT (ver LICENSE na raiz do repositório).
title: TH-STL-001 - Rundll32 com conteúdo remoto, script ou DLL em diretório gravável
id: f5debcfb-d2aa-4403-87d6-e9ab759c4dbd
status: experimental
description: >-
    Rundll32 executando script inline, buscando conteúdo remoto ou carregando DLL
    a partir de diretório gravável por usuários.
references:
    - https://attack.mitre.org/techniques/T1218/011/
author: Eduardo Fernandes Mateus
date: 2026-11-03
tags:
    - attack.stealth
    - attack.t1218.011
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\rundll32.exe'
        - OriginalFileName: 'RUNDLL32.EXE'
    selection_args:
        CommandLine|contains:
            - 'javascript:'
            - 'vbscript:'
            - 'http://'
            - 'https://'
            - '\AppData\'
            - '\Users\Public\'
            - '\Temp\'
            - '\ProgramData\'
            - '\Downloads\'
    condition: all of selection_*
falsepositives:
    - Componentes legítimos de software instalado por usuário em AppData
level: medium
