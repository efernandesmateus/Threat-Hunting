title: TH-STL-001 - Msiexec instalando pacote remoto
id: afedb0a8-9d2e-485a-8a5e-aca7b894b063
status: experimental
description: >-
    Msiexec instalando pacote diretamente de uma URL.
references:
    - https://attack.mitre.org/techniques/T1218/007/
author: Eduardo Fernandes Mateus
date: 2026-11-03
tags:
    - attack.stealth
    - attack.t1218.007
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\msiexec.exe'
        - OriginalFileName: 'msiexec.exe'
    selection_install:
        CommandLine|re: '(?i)[/-](i|package)\s'
    selection_url:
        CommandLine|contains:
            - 'http://'
            - 'https://'
    condition: all of selection_*
falsepositives:
    - Ferramentas de implantação de software que instalam pacotes a partir de servidores internos via HTTP
level: medium
---
title: TH-STL-001 - Certutil usado para baixar ou decodificar arquivos
id: 53903fb2-b05f-48d6-8354-a26e8396302c
status: experimental
description: >-
    Certutil com parâmetros de download de URL ou de decodificação de arquivos.
references:
    - https://attack.mitre.org/techniques/T1140/
    - https://attack.mitre.org/techniques/T1105/
author: Eduardo Fernandes Mateus
date: 2026-11-03
tags:
    - attack.stealth
    - attack.t1140
    - attack.command-and-control
    - attack.t1105
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\certutil.exe'
        - OriginalFileName: 'CertUtil.exe'
    selection_args:
        CommandLine|contains:
            - 'urlcache'
            - 'verifyctl'
            - '-decode'
            - '/decode'
    condition: all of selection_*
falsepositives:
    - Uso administrativo pontual para conversão de certificados
level: high
