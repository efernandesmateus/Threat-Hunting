level: high
---
title: TH-DIM-001 - Limpeza de logs, desativação de auditoria ou do firewall por linha de comando
id: 0ebe1813-7a21-4003-ba5c-30024f4129f9
status: experimental
description: >-
    Uso de wevtutil para limpar logs, de auditpol para remover ou desativar
    auditoria, ou de netsh para desligar o firewall do host.
references:
    - https://attack.mitre.org/techniques/T1685/005/
    - https://attack.mitre.org/techniques/T1685/001/
    - https://attack.mitre.org/techniques/T1686/003/
author: Eduardo Fernandes Mateus
date: 2026-11-03
tags:
    - attack.defense-impairment
    - attack.t1685.005
    - attack.t1685.001
    - attack.t1686.003
logsource:
    category: process_creation
    product: windows
detection:
    wevtutil_img:
        - Image|endswith: '\wevtutil.exe'
        - OriginalFileName: 'wevtutil.exe'
    wevtutil_args:
        CommandLine|contains:
            - ' cl '
            - ' clear-log '
    auditpol_img:
        - Image|endswith: '\auditpol.exe'
        - OriginalFileName: 'AUDITPOL.EXE'
    auditpol_args:
        CommandLine|contains:
            - '/clear'
            - '/remove'
            - ':disable'
    netsh_img:
        - Image|endswith: '\netsh.exe'
        - OriginalFileName: 'netsh.exe'
    netsh_args:
        - CommandLine|contains|all:
            - 'advfirewall'
            - 'state off'
        - CommandLine|contains|all:
            - 'firewall'
            - 'opmode'
            - 'disable'
    condition: (wevtutil_img and wevtutil_args) or (auditpol_img and auditpol_args) or (netsh_img and netsh_args)
falsepositives:
    - Scripts administrativos de manutenção ou de preparação de imagens
level: high
---
title: TH-DIM-001 - Auditoria ou serviço de log do Linux desativado
id: 4833917a-a639-43e9-8916-57fd94ae82fe
status: experimental
description: >-
    Desativação do sistema de auditoria (auditctl) ou parada e desabilitação de
    serviços de auditoria e de log.
references:
    - https://attack.mitre.org/techniques/T1685/004/
author: Eduardo Fernandes Mateus
date: 2026-11-03
tags:
    - attack.defense-impairment
    - attack.t1685.004
logsource:
    category: process_creation
    product: linux
detection:
    auditctl_img:
        Image|endswith: '/auditctl'
    auditctl_args:
        CommandLine|re: '\s-(e\s*0|D)(\s|$)'
    servico_img:
        Image|endswith:
            - '/systemctl'
            - '/service'
    servico_acao:
        CommandLine|contains:
            - 'stop'
            - 'disable'
            - 'mask'
            - 'kill'
    servico_alvo:
        CommandLine|contains:
            - 'auditd'
            - 'rsyslog'
            - 'syslog-ng'
            - 'systemd-journald'
    condition: (auditctl_img and auditctl_args) or (servico_img and servico_acao and servico_alvo)
falsepositives:
    - Manutenção planejada dos serviços de log por administradores
level: high
---
title: TH-DIM-001 - Supressão do histórico de comandos do shell
id: aa5b60ba-b3a7-442a-9b4d-8019e411372f
status: experimental
description: >-
    Comandos que desativam ou apagam o histórico do shell. Só aparecem na
    telemetria de processos quando passados a um novo shell (por exemplo, bash -c).
references:
    - https://attack.mitre.org/techniques/T1690/
author: Eduardo Fernandes Mateus
date: 2026-11-03
tags:
    - attack.defense-impairment
    - attack.t1690
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'HISTFILE=/dev/null'
            - 'unset HISTFILE'
            - 'HISTSIZE=0'
            - 'HISTFILESIZE=0'
            - 'history -c'
    condition: selection
falsepositives:
    - Scripts que desativam o histórico por motivos de privacidade em contas de automação
level: medium
