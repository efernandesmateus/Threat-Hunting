# Status: sintaxe verificada; não validada em plataforma real (ver ADR 0006).
# Os nomes de campos seguem a taxonomia genérica do Sigma e devem ser mapeados na conversão.
# A parada de agentes de segurança específicos e o "silêncio de telemetria" dependem da
# lista de serviços e do baseline de cada ambiente e ficam na pseudoconsulta do hunt.
