title: TH-DIM-001 - Auditoria do Windows desativada
id: 5f85fe03-52cf-4a3b-bb76-e108e5aaf40c
status: experimental
description: >-
    Política de auditoria alterada com remoção da auditoria de sucesso ou de falha
    (evento 4719).
references:
    - https://attack.mitre.org/techniques/T1685/001/
author: Eduardo Fernandes Mateus
date: 2026-11-03
tags:
    - attack.defense-impairment
    - attack.t1685.001
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4719
        AuditPolicyChanges|contains:
            - '%%8448'
            - '%%8450'
    condition: selection
falsepositives:
